# Netlify para el frontend de Vertex Math Vision.
# El repositorio es todo el proyecto (E:\vertex-math-vision); Netlify solo construye esta carpeta.
# En la UI de Netlify pon SOLO "Base directory" = app/frontend. Este archivo está dentro de esa carpeta
# y Netlify lo lee de ahí: build, publish, Node, redirecciones y cabeceras salen de aquí.
[build]
  command = "npm run build"
  publish = "dist/frontend/browser"
  # No reconstruir si el commit no toca el frontend (cambios en el modelo, el Space, los scripts…).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
  # npm 10 (el de Node 22) falla con un error interno ("edgesOut") al resolver las dependencias de Angular 21.
  NPM_FLAGS = "--legacy-peer-deps"

# SPA: cualquier ruta (p. ej. /privacidad) la resuelve Angular.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    # connect-src: el Space del backend. Si cambia el nombre del Space, cámbialo aquí también.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://denisijcu-vertex-math-vision.hf.space wss://denisijcu-vertex-math-vision.hf.space https://huggingface.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
